<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Plantar é vida</title>
</head>
<body>
    <header>
    <!--Regarregar site quando clicar no title page-->
        <h1><a href="#">Plantar é vida</a></h1>

        <h2>identificar</h2>
        
            <nav class="navBar_expand">
                <li>ESPÉCIE</li>
                <li>CONTRIBUIÇÕES</li>
                <li>GRUPOS</li>   
            </nav>
        
    
    </header>
    <!--Fim header-->

    <!--Início do main page-->
    <main>

        <section id="add-plant">
            <h2>Qual planta você trouxe para cuidar hoje?</h2>

        <div>
            <label for="plantName">Nome da Planta</label>
            <input id="plantName" type="text" placeholder="Ex: Samambaia">
        </div>

        <br />

        <div>
            <label for="startDate">Desde quando ela está com você?</label> <br>
            <input id="startDate" type="date">
        </div>

        <br />

            <button id="addName" type="button">Adicionar ao meu jardim</button>   
        </section>


        <hr /> 
        
        <section id="minha-planta">
            <h2>Minha planta</h2>
            <p id="plantaSumario">Nenhuma planta foi adicionada ainda</p>
            <p id="plantaDias"></p>
        </section>

        <hr />

        <section id="diario">
            <h2>Diário de cuidados</h2>
           <fieldset>
                <legend>Meu registro</legend>
                <label for="nota">Registre aqui seus cuidados</label>
                <input type="nota" id="nota" placeholder="ex: reguei, tratei terra, movi">
                <button type="botaoSalvar">Salvar</button>
            </fieldset>

            <ul>

            </ul>
        </section>
        
    </main>

    <footer>
        <p>Planta Vida - Projeto em construção 🌿</p>
    </footer>

</body>
</html>
